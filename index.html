  <meta name="description" content="Photocap: editor de fotos por capas que funciona en tu dispositivo, sin subir tus fotos." />
  <script>
    // Desde el primer momento (también si el editor no llega a arrancar): registro de errores para «Ayuda › Informe de
    // errores», aviso si la sesión anterior se cerró de golpe y, si no arranca, un mensaje con «Recargar» en vez de una
    // pantalla en blanco.
    (function () {
      var K = 'editor.errors';
      function add(m) { try { var l = JSON.parse(localStorage.getItem(K) || '[]'); l.push({ t: Date.now(), m: String(m).slice(0, 1500) }); localStorage.setItem(K, JSON.stringify(l.slice(-25))); } catch (e) { } }
      window.__editorLogError = add;
      addEventListener('error', function (e) { var t = e.target; add((e.error && e.error.stack) || e.message || ('No se ha podido cargar ' + (t && (t.src || t.href)))); }, true);
      addEventListener('unhandledrejection', function (e) { var r = e.reason; if (r && r.name === 'AbortError') return; add((r && r.stack) || r); });
      try { var run = localStorage.getItem('editor.running'); if (run && Date.now() - +run < 3600000) add('La sesión anterior se cerró de golpe (con el editor a la vista)'); } catch (e) { }
      setTimeout(function () {
        if (window.editorApp) return;
        add('El editor no ha arrancado en 12 s');
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d1e21;color:#ddd;font:15px sans-serif;padding:24px;text-align:center;z-index:9999';
        d.innerHTML = '<div>No se ha podido abrir el editor.<br>The editor could not start.<br><br><button onclick="location.reload()" style="font:inherit;padding:10px 18px">Recargar / Reload</button></div>';
        document.body.appendChild(d);
      }, 12000);
    })();
  </script>
